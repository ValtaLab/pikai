<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PikAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --border: #2a2a3a;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            padding: 3rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        .date-badge {
            display: inline-block;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.15);
        }
        
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-secondary);
        }
        
        .card-image.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 3rem;
        }
        
        .card-content {
            padding: 1.25rem;
        }
        
        .card-source {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            margin-bottom: 0.75rem;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        
        .card-title a {
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .card-title a:hover {
            color: var(--accent);
        }
        
        .card-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .card-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .card-link:hover {
            color: var(--accent-hover);
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }
        
        .error {
            text-align: center;
            padding: 4rem;
            color: #ef4444;
        }
        
        .no-image {
            background: linear-gradient(135deg, #1a1a24 0%, #2a2a3a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 2rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .news-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 PikAI</h1>
            <p>每日精選 AI 資訊，來源多元化</p>
            <span class="date-badge" id="dateBadge">載入中...</span>
        </header>
        
        <div class="news-grid" id="newsGrid">
            <div class="loading">載入最新新聞...</div>
        </div>
    </div>

    <script>
        // News data will be injected at build time or fetched from API
        const NEWS_API_URL = '/news-data.json';
        
        async function loadNews() {
            const grid = document.getElementById('newsGrid');
            const dateBadge = document.getElementById('dateBadge');
            
            try {
                const response = await fetch(NEWS_API_URL);
                if (!response.ok) throw new Error('Failed to load news');
                
                const data = await response.json();
                
                // Update date badge
                const newsDate = new Date(data.date);
                dateBadge.textContent = newsDate.toLocaleDateString('zh-TW', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    weekday: 'long'
                });
                
                if (!data.news || data.news.length === 0) {
                    grid.innerHTML = '<div class="error">今日暫無新聞</div>';
                    return;
                }
                
                // Render news cards
                grid.innerHTML = data.news.map(item => `
                    <article class="news-card">
                        ${item.image 
                            ? `<img src="${item.image}" alt="${item.title}" class="card-image" loading="lazy" onerror="this.outerHTML='<div class=\\'card-image no-image\\'>🖼️</div>'">`
                            : '<div class="card-image no-image">🖼️</div>'
                        }
                        <div class="card-content">
                            <span class="card-source">${item.source}</span>
                            <h3 class="card-title">
                                <a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>
                            </h3>
                            <p class="card-summary">${item.summary || ''}</p>
                            <div class="card-footer">
                                <a href="${item.url}" target="_blank" rel="noopener" class="card-link">閱讀全文 →</a>
                            </div>
                        </div>
                    </article>
                `).join('');
                
            } catch (error) {
                console.error('Error loading news:', error);
                grid.innerHTML = `
                    <div class="error">
                        <p>載入新聞失敗</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">請稍後再試</p>
                    </div>
                `;
            }
        }
        
        loadNews();
    </script>
</body>
</html>
