<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b31b1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- 頂部裝飾條 -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentGrad)"/>
  
  <!-- 左側裝飾條 -->
  <rect x="60" y="120" width="6" height="390" fill="#b31b1b"/>
  
  <!-- 底部裝飾條 -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accentGrad)"/>
  
  <!-- arXiv 主標題 -->
  <text x="600" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="120" font-weight="bold" fill="#ffffff" text-anchor="middle">arXiv</text>
  
  <!-- cs.AI 副標題 -->
  <text x="600" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="60" font-weight="bold" fill="#b31b1b" text-anchor="middle">cs.AI</text>
  
  <!-- 描述文字 -->
  <text x="600" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" fill="#888888" text-anchor="middle">Artificial Intelligence</text>
  
  <!-- 右側抽象神經網絡圖案 -->
  <g opacity="0.3">
    <!-- 節點 -->
    <circle cx="850" cy="150" r="4" fill="#4a4a6a"/>
    <circle cx="920" cy="180" r="3" fill="#4a4a6a"/>
    <circle cx="880" cy="250" r="5" fill="#4a4a6a"/>
    <circle cx="950" cy="280" r="3" fill="#4a4a6a"/>
    <circle cx="900" cy="350" r="4" fill="#4a4a6a"/>
    <circle cx="980" cy="380" r="3" fill="#4a4a6a"/>
    <circle cx="920" cy="450" r="5" fill="#4a4a6a"/>
    <circle cx="1000" cy="480" r="4" fill="#4a4a6a"/>
    <circle cx="870" cy="520" r="3" fill="#4a4a6a"/>
    <circle cx="950" cy="550" r="4" fill="#4a4a6a"/>
    
    <!-- 連接線 -->
    <line x1="850" y1="150" x2="920" y2="180" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="920" y1="180" x2="880" y2="250" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="880" y1="250" x2="950" y2="280" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="950" y1="280" x2="900" y2="350" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="900" y1="350" x2="980" y2="380" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="980" y1="380" x2="920" y2="450" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="920" y1="450" x2="1000" y2="480" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="1000" y1="480" x2="950" y2="550" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="850" y1="150" x2="880" y2="250" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="920" y1="180" x2="900" y2="350" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="880" y1="250" x2="920" y2="450" stroke="#4a4a6a" stroke-width="1"/>
    <line x1="950" y1="280" x2="980" y2="380" stroke="#4a4a6a" stroke-width="1"/>
  </g>
  
  <!-- 左下角小字 -->
  <text x="80" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#555555">Research Papers • Machine Learning • Neural Networks</text>
</svg>