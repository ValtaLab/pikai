name = "pikai"
main = "worker.js"
compatibility_date = "2025-01-01"

# Cloudflare Account ID for Workers AI
[vars]
CF_ACCOUNT_ID = "77002f1945c94a1c33a11717015c378b"

# Workers AI binding
[ai]
binding = "AI"

# Cron Triggers (news is Pi feeder only — Worker cron must NOT overwrite news):
#  00:00 / 10:00 UTC = 08:00 / 18:00 HKT — tools + rankings only
#  YouTube: Pi cron → /trigger-youtube
[triggers]
crons = ["0 0 * * *", "0 10 * * *"]

# KV Namespace for caching news data
[[kv_namespaces]]
binding = "AI_NEWS_KV"
id = "b8dfffba53d249e2a6a73e60774217d5"
